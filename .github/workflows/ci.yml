name: Shell Script Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Bash Syntax & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Bash Syntax
        run: |
          for f in *.sh; do
            bash -n "$f"
          done

      - name: Run ShellCheck (errors)
        run: shellcheck -S error *.sh
